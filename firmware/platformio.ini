[platformio]
default_envs = esp32
data_dir = ../dashboard        ; the dashboard folder is uploaded to the ESP32 as its web page

[env]
platform = espressif32 @ 6.12.0  ; official platform (Arduino core 2.0.17)
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor

; Real hardware (sensors connected)
[env:esp32]

; Bare ESP32, no sensors: fake readings, BOOT button = acknowledge, send 'h' in Serial Monitor to test the watchdog
[env:esp32-sim]
build_flags = -DSIM_MODE -DDEBUG_HANG
